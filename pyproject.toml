[build-system]
requires = [
    #
    # If we build our extensions with Cython 3.0.0, then they will be an
    # order of magnitude slower, so avoid it for now.
    #
    "Cython>=0.29.32,<3.0.0",

    # Use latest prebuilt NumPy on Windows ARM64
    "numpy; sys_platform == 'win32' and platform_machine == 'arm64'",

    # Gensim specific numpy constraint on CPython 3.8 non-arm platforms
    "numpy==1.18.5; python_version == '3.8' and platform_machine not in 'arm64|aarch64'",

    # Fallback for other non-Windows platforms and ARM
    "oldest-supported-numpy; (python_version > '3.8' or platform_machine in 'arm64|aarch64') and sys_platform != 'win32'",

    "setuptools",
    "wheel",
]
