[build-system]
requires = [
    #
    # If we build our extensions with Cython 3.0.0, then they will be an
    # order of magnitude slower, so avoid it for now.
    #
    "Cython>=0.29.32,<3.0.0",
    # Use latest NumPy for Windows builds with Python > 3.10 (including ARM64)
    "numpy>=1.19.0; python_version > '3.10' and sys_platform == 'win32'",
    # Gensim specific numpy constraint on CPython 3.8 non-ARM platforms
    "numpy==1.18.5; (python_version == '3.8' and platform_machine not in 'arm64|aarch64') or (python_version == '3.8' and sys_platform == 'win32')",
    # Use oldest-supported-numpy for other cases
    "oldest-supported-numpy; (python_version > '3.8' or platform_machine == 'arm64' or platform_machine == 'aarch64') and sys_platform != 'win32'",
    "oldest-supported-numpy; (python_version > '3.8' and python_version < '3.11' and sys_platform == 'win32')",
    "setuptools",
    "wheel",
]
