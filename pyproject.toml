[build-system]
requires = [
    #
    # Avoid Cython 3.0.0 – too slow
    #
    "Cython>=0.29.32,<3.0.0",

    "numpy==1.18.5; python_version=='3.8' and platform_machine not in 'arm64|aarch64'",
    "numpy; sys_platform == 'win32' and platform_machine in 'arm64|aarch64'",
    "oldest-supported-numpy; python_version>'3.8' and sys_platform == 'win32' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')" ,
    "oldest-supported-numpy; platform_machine in 'arm64|aarch64' and sys_platform != 'win32'",

    "setuptools",
    "wheel",
]
