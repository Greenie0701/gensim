[build-system]
requires = [
    "Cython>=0.29.32,<3.0.0",
    "numpy==1.18.5; python_version == '3.8' and platform_machine not in 'arm64|aarch64'",
    "oldest-supported-numpy; python_version > '3.8' and python_version < '3.11'",
    "oldest-supported-numpy; sys_platform != 'win32' and platform_machine in 'arm64|aarch64'",
    "numpy; python_version > '3.11' and sys_platform == 'win32' and platform_machine in 'arm64|aarch64'",
    "oldest-supported-numpy; python_version > '3.11' and sys_platform == 'win32' and platform_machine not in 'arm64|aarch64'",
    "setuptools",
    "wheel",
]
